name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  scope:
    name: Scope and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      mysql: ${{ steps.scope.outputs.mysql }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/pr-scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check release versions
        if: steps.scope.outputs.versions == 'true'
        run: python3 scripts/ci/check-versions.py
      - name: Check script syntax and Compose configuration
        if: steps.scope.outputs.scripts == 'true'
        env:
          MYSQL_ROOT_PASSWORD: ci-config-only
          MYSQL_PASSWORD: ci-config-only
          SECRET_KEY: ci-config-only-not-a-production-secret-key
        run: |
          for script in ./*.sh scripts/ci/*.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('scripts/ci').glob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          docker compose config --quiet
      - name: Check workflow syntax
        if: steps.scope.outputs.workflows == 'true'
        run: bash scripts/ci/check-workflows.sh

  frontend:
    name: Frontend types and build
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run type-check
      - run: npm --prefix frontend run build

  backend:
    name: Backend SQLite regression
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run existing regression suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python -m pytest tests/test_*.py -q --junitxml=artifacts/sqlite.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sqlite-regression-${{ github.sha }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  mysql:
    name: Server MySQL contract
    needs: scope
    if: needs.scope.outputs.mysql == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run real MySQL contract
        working-directory: backend
        env:
          PYTHONPATH: .
          MYSQL_TEST_PASSWORD: ci-mysql-only
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          mkdir -p artifacts
          export RADIO_TEST_MYSQL_ADMIN_URL="mysql+pymysql://root:${MYSQL_TEST_PASSWORD}@127.0.0.1:${MYSQL_TEST_PORT}"
          python -m pytest tests/contracts/mysql -q --junitxml=artifacts/mysql.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mysql-contract-${{ github.sha }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: CI
    needs: [scope, frontend, backend, mysql]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          needs = json.loads(os.environ['RESULTS'])
          scope = needs['scope']
          failed = scope['result'] != 'success'
          rows = ['## PR checks', '', '| Check | Result |', '| --- | --- |',
                  f"| scope | {scope['result']} |"]
          for name in ('frontend', 'backend', 'mysql'):
              selected = scope.get('outputs', {}).get(name) == 'true'
              result = needs[name]['result']
              failed |= selected and result != 'success'
              rows.append(f"| {name} | {result if selected else 'not applicable'} |")
          rows += ['', 'This is not a platform release acceptance. Full contracts and packages are manual.']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(rows) + '\n')
          raise SystemExit(1 if failed else 0)
          PY
