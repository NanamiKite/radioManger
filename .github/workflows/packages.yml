name: Manual target validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select one target; no release publishing or production deployment'
        required: true
        default: web
        type: choice
        options:
          - web
          - server
          - windows-web
          - windows-desktop
          - macos
          - contracts-sqlite
          - contracts-mysql
          - contracts-browser

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  web:
    if: inputs.target == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/ci/check-versions.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run type-check
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  server:
    if: inputs.target == 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python scripts/ci/check-versions.py
      - run: python -m pip install websockets==16.0
      - run: bash scripts/ci/smoke-server.sh artifacts/server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-validation-${{ github.sha }}
          path: artifacts/server/
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    if: inputs.target == 'windows-web' || inputs.target == 'windows-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python scripts/ci/check-versions.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run type-check
      - name: Build selected Windows archive
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p artifacts/build
          case "$TARGET" in
            windows-web) bash build-win64-web.sh 2>&1 | tee artifacts/build/build.log ;;
            windows-desktop) bash build-win64-desktop.sh 2>&1 | tee artifacts/build/build.log ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-${{ inputs.target }}-${{ github.sha }}
          path: releases/*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log-${{ inputs.target }}-${{ github.sha }}
          path: artifacts/build/
          if-no-files-found: ignore
          retention-days: 7

  windows-runtime:
    name: Windows packaged backend (GUI not verified)
    needs: windows-build
    if: inputs.target == 'windows-web' || inputs.target == 'windows-desktop'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unverified-${{ inputs.target }}-${{ github.sha }}
          path: releases
      - name: Run archive with embedded Python and SQLite
        run: |
          version=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          archives=(releases/*.zip)
          test "${#archives[@]}" -eq 1
          python scripts/ci/smoke-local.py --archive "${archives[0]}" --version "$version" --logs artifacts/local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-${{ inputs.target }}-${{ github.sha }}
          path: artifacts/local/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS local archive and SQLite
    if: inputs.target == 'macos'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python scripts/ci/check-versions.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run type-check
      - name: Build and exercise extracted archive
        run: |
          mkdir -p artifacts/local
          bash build_release.sh mac 2>&1 | tee artifacts/local/build.log
          version=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          python scripts/ci/smoke-local.py --archive "releases/RadioManager-${version}-macos.tar.gz" --version "$version" --logs artifacts/local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ github.sha }}
          path: releases/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-macos-${{ github.sha }}
          path: artifacts/local/
          if-no-files-found: ignore
          retention-days: 7

  contracts-sqlite:
    name: Full SQLite contracts (diagnostic)
    if: inputs.target == 'contracts-sqlite'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python -m pytest tests --ignore=tests/contracts/mysql -q --junitxml=artifacts/sqlite-contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sqlite-contracts-${{ github.sha }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  contracts-mysql:
    name: Real MySQL contracts (diagnostic)
    if: inputs.target == 'contracts-mysql'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          PYTHONPATH: .
          MYSQL_TEST_PASSWORD: ci-mysql-only
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          mkdir -p artifacts
          export RADIO_TEST_MYSQL_ADMIN_URL="mysql+pymysql://root:${MYSQL_TEST_PASSWORD}@127.0.0.1:${MYSQL_TEST_PORT}"
          python -m pytest tests/contracts/mysql -q --junitxml=artifacts/mysql-contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mysql-contracts-${{ github.sha }}
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  contracts-browser:
    name: Browser contracts (diagnostic)
    if: inputs.target == 'contracts-browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tests/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend/tests ci
      - run: npx --prefix frontend/tests playwright install --with-deps chromium
      - name: Run browser contracts without retries
        working-directory: frontend/tests
        run: npm test -- --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-contracts-${{ github.sha }}
          path: |
            frontend/tests/playwright-report/
            frontend/tests/test-results/
          if-no-files-found: ignore
          retention-days: 7
