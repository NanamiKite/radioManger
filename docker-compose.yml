# RadioManager Docker Compose (服务器部署)
# 用法: docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: radiomanager_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: radiomanager
      MYSQL_USER: radiomanager
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - radiomanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radiomanager_backend
    environment:
      DATABASE_MODE: mysql
      DATABASE_URL: mysql+pymysql://radiomanager:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/radiomanager
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      DEBUG: "false"
      ENVIRONMENT: production
      WORKERS: "1"
      FORWARDED_ALLOW_IPS: "*"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@radiomanager.local}
    command: ["sh", "-c", "python -m app.scripts.init_db && if [ -n \"$$ADMIN_PASSWORD\" ]; then python -m app.scripts.create_admin; fi && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - radiomanager
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radiomanager_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - radiomanager
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  radiomanager:
    driver: bridge
